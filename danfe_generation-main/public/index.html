<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste API DANFE HTML</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2rem;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .panels {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 1000px) {
            .panels {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .panel h2 {
            margin-bottom: 15px;
            font-size: 1.1rem;
            color: #00d4ff;
        }

        textarea {
            width: 100%;
            height: 300px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 15px;
            color: #fff;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 12px;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: #00d4ff;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            color: #fff;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-success {
            background: linear-gradient(90deg, #00c853, #00e676);
            color: #fff;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 200, 83, 0.4);
        }

        .status {
            margin-top: 15px;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }

        .status.success {
            display: block;
            background: rgba(0, 200, 83, 0.2);
            border: 1px solid #00c853;
            color: #00e676;
        }

        .status.error {
            display: block;
            background: rgba(255, 82, 82, 0.2);
            border: 1px solid #ff5252;
            color: #ff5252;
        }

        .status.loading {
            display: block;
            background: rgba(0, 212, 255, 0.2);
            border: 1px solid #00d4ff;
            color: #00d4ff;
        }

        .meta-info {
            margin-top: 15px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            display: none;
        }

        .meta-info.show {
            display: block;
        }

        .meta-info h3 {
            margin-bottom: 10px;
            color: #00d4ff;
            font-size: 14px;
        }

        .meta-info p {
            margin: 5px 0;
            font-size: 13px;
            color: #ccc;
        }

        .meta-info strong {
            color: #fff;
        }

        .preview-frame {
            width: 100%;
            height: 600px;
            background: #fff;
            border-radius: 8px;
            border: none;
        }

        .endpoint-info {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-family: monospace;
        }

        .endpoint-info code {
            color: #00d4ff;
        }

        .logo-section {
            margin-top: 15px;
        }

        .logo-section label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: #aaa;
        }

        .logo-section input[type="file"] {
            display: none;
        }

        .logo-preview {
            margin-top: 10px;
            max-width: 150px;
            max-height: 80px;
            display: none;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .tab {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            color: #fff;
            transition: all 0.3s;
        }

        .tab.active {
            background: rgba(0, 212, 255, 0.2);
            border-color: #00d4ff;
            color: #00d4ff;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🧪 Teste API DANFE HTML</h1>

        <div class="endpoint-info">
            <strong>Endpoint:</strong> <code>POST https://danfe.lojaodosmoveis.shop/danfe/html-base64</code>
        </div>

        <div class="panels">
            <!-- Painel de Input -->
            <div class="panel">
                <h2>📝 XML da NF-e</h2>
                <textarea id="xmlInput" placeholder="Cole aqui o XML completo da NF-e (nfeProc)..."></textarea>

                <div class="logo-section">
                    <label>Logo da empresa (opcional):</label>
                    <button class="btn-secondary" onclick="document.getElementById('logoInput').click()">
                        📷 Selecionar Logo
                    </button>
                    <input type="file" id="logoInput" accept="image/png,image/jpeg" onchange="handleLogoSelect(this)">
                    <img id="logoPreview" class="logo-preview" alt="Logo preview">
                    <span id="logoName" style="margin-left: 10px; font-size: 12px; color: #aaa;"></span>
                </div>

                <div class="btn-group">
                    <button class="btn-primary" onclick="enviarXml()">
                        🚀 Gerar DANFE
                    </button>
                    <button class="btn-secondary" onclick="carregarExemplo()">
                        📄 Carregar Exemplo
                    </button>
                    <button class="btn-secondary" onclick="limpar()">
                        🗑️ Limpar
                    </button>
                </div>

                <div id="status" class="status"></div>

                <div id="metaInfo" class="meta-info">
                    <h3>📋 Metadados da NF-e</h3>
                    <p><strong>Número:</strong> <span id="metaNF"></span></p>
                    <p><strong>Série:</strong> <span id="metaSerie"></span></p>
                    <p><strong>Chave:</strong> <span id="metaChave"></span></p>
                    <p><strong>Emitente:</strong> <span id="metaEmit"></span></p>
                    <p><strong>Destinatário:</strong> <span id="metaDest"></span></p>
                </div>
            </div>

            <!-- Painel de Output -->
            <div class="panel">
                <h2>📄 Resultado</h2>

                <div class="tabs">
                    <div class="tab active" onclick="showTab('preview')">Visualização</div>
                    <div class="tab" onclick="showTab('base64')">Base64</div>
                    <div class="tab" onclick="showTab('json')">JSON Response</div>
                </div>

                <div id="tabPreview" class="tab-content active">
                    <iframe id="previewFrame" class="preview-frame"></iframe>
                </div>

                <div id="tabBase64" class="tab-content">
                    <textarea id="base64Output" readonly placeholder="O HTML em Base64 aparecerá aqui..."></textarea>
                    <div class="btn-group">
                        <button class="btn-secondary" onclick="copiarBase64()">📋 Copiar Base64</button>
                    </div>
                </div>

                <div id="tabJson" class="tab-content">
                    <textarea id="jsonOutput" readonly
                        placeholder="A resposta JSON completa aparecerá aqui..."></textarea>
                    <div class="btn-group">
                        <button class="btn-secondary" onclick="copiarJson()">📋 Copiar JSON</button>
                    </div>
                </div>

                <div class="btn-group" style="margin-top: 15px;">
                    <button class="btn-success" onclick="abrirNovaAba()">
                        🔗 Abrir em Nova Aba
                    </button>
                    <button class="btn-secondary" onclick="imprimir()">
                        🖨️ Imprimir
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let logoBase64 = null;
        let lastHtmlContent = null;
        let lastResponse = null;

        // Função para decodificar Base64 com UTF-8 corretamente
        function decodeBase64UTF8(base64) {
            const binaryString = atob(base64);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return new TextDecoder('utf-8').decode(bytes);
        }

        async function enviarXml() {
            const xml = document.getElementById('xmlInput').value.trim();
            const status = document.getElementById('status');

            if (!xml) {
                showStatus('error', 'Por favor, cole o XML da NF-e');
                return;
            }

            showStatus('loading', '⏳ Processando...');

            try {
                const body = { xml };
                if (logoBase64) {
                    body.logoBase64 = logoBase64;
                }

                const response = await fetch('https://danfe.lojaodosmoveis.shop/danfe/html-base64', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(body),
                });

                const data = await response.json();
                lastResponse = data;

                if (!response.ok) {
                    showStatus('error', `Erro: ${data.error || data.message}`);
                    return;
                }

                // Sucesso
                showStatus('success', '✅ DANFE gerada com sucesso!');

                // Decodifica o HTML (UTF-8)
                lastHtmlContent = decodeBase64UTF8(data.html_base64);

                // Mostra no iframe
                const iframe = document.getElementById('previewFrame');
                iframe.srcdoc = lastHtmlContent;

                // Mostra Base64
                document.getElementById('base64Output').value = data.html_base64;

                // Mostra JSON
                document.getElementById('jsonOutput').value = JSON.stringify(data, null, 2);

                // Mostra metadados
                document.getElementById('metaNF').textContent = data.meta.nNF;
                document.getElementById('metaSerie').textContent = data.meta.serie;
                document.getElementById('metaChave').textContent = data.meta.chave;
                document.getElementById('metaEmit').textContent = data.meta.emitente;
                document.getElementById('metaDest').textContent = data.meta.destinatario;
                document.getElementById('metaInfo').classList.add('show');

            } catch (error) {
                showStatus('error', `Erro de conexão: ${error.message}. Verifique se o servidor está rodando.`);
            }
        }

        function showStatus(type, message) {
            const status = document.getElementById('status');
            status.className = `status ${type}`;
            status.textContent = message;
        }

        function showTab(tabName) {
            // Remove active de todas as tabs
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));

            // Ativa a tab selecionada
            event.target.classList.add('active');
            document.getElementById(`tab${tabName.charAt(0).toUpperCase() + tabName.slice(1)}`).classList.add('active');
        }

        function handleLogoSelect(input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const base64 = e.target.result.split(',')[1]; // Remove o prefixo data:image/...
                    logoBase64 = base64;

                    document.getElementById('logoPreview').src = e.target.result;
                    document.getElementById('logoPreview').style.display = 'inline-block';
                    document.getElementById('logoName').textContent = file.name;
                };
                reader.readAsDataURL(file);
            }
        }

        function carregarExemplo() {

        </imposto>
      </det>
      <total>
        <ICMSTot>

      </total>

      <infAdic>
        <infCpl>Informações complementares da nota fiscal.</infCpl>

  </NFe>
  <protNFe versao="4.00">
    <infProt>
      <chNFe>35210312345678000123550010001234561234567890</chNFe>
      <dhRecbto>2024-01-15T10:35:00-03:00</dhRecbto>

            showStatus('success', '📄 XML de exemplo carregado!');
        }

        function limpar() {
            document.getElementById('xmlInput').value = '';
            document.getElementById('base64Output').value = '';
            document.getElementById('jsonOutput').value = '';
            document.getElementById('previewFrame').srcdoc = '';
            document.getElementById('status').className = 'status';
            document.getElementById('metaInfo').classList.remove('show');
            logoBase64 = null;
            document.getElementById('logoPreview').style.display = 'none';
            document.getElementById('logoName').textContent = '';
            lastHtmlContent = null;
            lastResponse = null;
        }

        function copiarBase64() {
            const base64 = document.getElementById('base64Output').value;
            navigator.clipboard.writeText(base64);
            showStatus('success', '📋 Base64 copiado!');
        }

        function copiarJson() {
            const json = document.getElementById('jsonOutput').value;
            navigator.clipboard.writeText(json);
            showStatus('success', '📋 JSON copiado!');
        }

        function abrirNovaAba() {
            if (!lastHtmlContent) {
                showStatus('error', 'Gere a DANFE primeiro');
                return;
            }
            const blob = new Blob([lastHtmlContent], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            window.open(url, '_blank');
        }

        function imprimir() {
            if (!lastHtmlContent) {
                showStatus('error', 'Gere a DANFE primeiro');
                return;
            }
            const iframe = document.getElementById('previewFrame');
            iframe.contentWindow.print();
        }
    </script>
</body>

</html>
